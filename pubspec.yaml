# pubspec.yaml
name: aero_messenger
description: A Frutiger Aero / MSN Messenger inspired real-time chat app for Android.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Firebase
  firebase_core: ^2.27.0
  firebase_auth: ^4.17.8
  cloud_firestore: ^4.15.8
  firebase_storage: ^11.6.9
  firebase_messaging: ^14.7.10

  # Foreground notification banners + high-importance channel
  flutter_local_notifications: ^17.2.1

  # Audio (nudge sound, message notification sounds)
  audioplayers: ^5.2.1

  # Avatar upload
  image_picker: ^1.0.7

  # Offline caching / local persistence
  shared_preferences: ^2.2.2

  # UI helpers
  cached_network_image: ^3.3.1
  google_fonts: ^6.2.1
  intl: ^0.19.0
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/sounds/
    - assets/emoticons/
    - assets/icons/
